<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | DagEduGame</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" style="width: 100%; height: 100%;"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
        <div id="unity-footer">
            <div id="unity-webgl-logo"></div>
            <button id="unity-fullscreen-button" style="display: block;">Go Fullscreen</button>
            <div id="unity-build-title">DagEduGame</div>
        </div>
    </div>
    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var warningBanner = document.querySelector("#unity-warning");

        // Shows a temporary message banner or an error message.
        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type === 'error') div.style = 'background: red; padding: 10px; color: white;';
            else {
                if (type === 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(() => {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/EduGameDag.loader.js";
        var config = {
            dataUrl: buildUrl + "/EduGameDag.data",
            frameworkUrl: buildUrl + "/EduGameDag.framework.js",
            codeUrl: buildUrl + "/EduGameDag.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "NamusTV",
            productName: "DagEduGame",
            productVersion: "0.1",
            showBanner: unityShowBanner,
        };

        // Check for WebGL support and notify the user if it's unavailable.
        if (!window.WebGLRenderingContext) {
            unityShowBanner("WebGL is not supported by your browser. Please use a modern browser like Chrome or Firefox.", "error");
        }

        // Responsive design for mobile and desktop
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";
            unityShowBanner('WebGL builds are not fully supported on mobile devices.', 'warning');
            config.devicePixelRatio = 1;
        } else {
            canvas.style.width = "600px";
            canvas.style.height = "960px";
        }

        canvas.style.background = "url('" + buildUrl + "/EduGameDag.jpg') center / cover";
        loadingBar.style.display = "block";

        // Load the Unity build
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                    unityInstance.SetFullscreen(1);
                };
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
